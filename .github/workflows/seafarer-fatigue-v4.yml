name: Build Seafarer Fatigue AI v4

on:
  push:
    branches:
      - seafarer-fatigue-playstore-v4
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile v4 debug APK
        working-directory: seafarer-fatigue-app-v3
        run: gradle :app:assembleDebug --stacktrace

      - name: Package validation artifact
        run: |
          cp seafarer-fatigue-app-v3/app/build/outputs/apk/debug/app-debug.apk Seafarer_Fatigue_AI_v4_validation.apk
          sha256sum Seafarer_Fatigue_AI_v4_validation.apk > Seafarer_Fatigue_AI_v4_validation_SHA256.txt

      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: Seafarer_Fatigue_AI_v4_validation
          path: |
            Seafarer_Fatigue_AI_v4_validation.apk
            Seafarer_Fatigue_AI_v4_validation_SHA256.txt
          if-no-files-found: error
          retention-days: 7
